    <title>Seus Empréstimos - Biblioteca</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #b22222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 40px;
            max-width: 700px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            margin-bottom: 30px;
            animation: slideDown 0.8s ease-out 0.2s both;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .greeting {
            font-size: 24px;
            color: #1e1e1e;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .greeting .user-name {
            color: #b22222;
            font-weight: 700;
        }

        h1 {
            font-size: 36px;
            color: #1e1e1e;
            margin-bottom: 15px;
            font-weight: 700;
            animation: slideUp 0.8s ease-out 0.4s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .instruction {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
            animation: slideUp 0.8s ease-out 0.6s both;
        }

        .books-container {
            max-height: 500px;
            overflow-y: auto;
            animation: slideUp 0.8s ease-out 0.8s both;
        }

        .books-container::-webkit-scrollbar {
            width: 8px;
        }

        .books-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .books-container::-webkit-scrollbar-thumb {
            background: #b22222;
            border-radius: 10px;
        }

        .books-container::-webkit-scrollbar-thumb:hover {
            background: #dc3545;
        }

        .book-item {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 20px;
            margin-bottom: 15px;
            background: #f9f9f9;
            border-left: 4px solid #b22222;
            border-radius: 10px;
            transition: all 0.3s ease;
            animation: itemSlideIn 0.6s ease-out forwards;
        }

        .book-item:nth-child(1) {
            animation-delay: 1s;
        }

        .book-item:nth-child(2) {
            animation-delay: 1.1s;
        }

        .book-item:nth-child(3) {
            animation-delay: 1.2s;
        }

        @keyframes itemSlideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .book-item:hover {
            background: #f0f0f0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }

        .book-cover {
            width: 80px;
            height: 120px;
            background: linear-gradient(135deg, #b22222 0%, #dc3545 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            padding: 8px;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(178, 34, 34, 0.3);
        }

        .book-info {
            flex: 1;
            text-align: left;
        }

        .book-title {
            font-size: 18px;
            color: #1e1e1e;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .book-due-date {
            font-size: 14px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .book-due-date.overdue {
            color: #b22222;
            font-weight: 600;
        }

        .due-date-icon {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: currentColor;
            border-radius: 50%;
        }

        .return-button {
            background: linear-gradient(135deg, #b22222 0%, #dc3545 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(178, 34, 34, 0.3);
            flex-shrink: 0;
        }

        .return-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(178, 34, 34, 0.4);
        }

        .return-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(178, 34, 34, 0.3);
        }

        .btn-finalizar {
            background: linear-gradient(135deg, #b22222 0%, #dc3545 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(178, 34, 34, 0.3);
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .instruction {
                font-size: 16px;
            }

            .book-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .book-cover {
                width: 100%;
            }

            .return-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="greeting">Olá, <span class="user-name"></span>!</div>
        </div>

        <h1>Seus Empréstimos</h1>

        <p class="instruction" id="instruction-message"> Selecione o livro que você deseja devolver agora.</p>

        <div class="books-container"></div>

        <button class="btn-finalizar" onclick="finalizarSessao()"> 🔒 Finalizar Sessão</button>
    </div>
    <script src="lista_livros.js"></script>
</body>
</html>
